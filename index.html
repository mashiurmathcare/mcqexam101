<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math MCQ Exam - Bangla</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 { text-align: center; color: #2c3e50; }
        .card {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #timer-container {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 15px;
        }
        .option-label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .option-label:hover { background: #f1f1f1; }
        input[type="radio"] { margin-right: 10px; }
        .btn {
            display: block;
            width: 100%;
            background: #3498db;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover { background: #2980b9; }
        .hidden { display: none; }
        .correct-ans { color: #27ae60; font-weight: bold; }
        .wrong-ans { color: #c0392b; font-weight: bold; }
        .explanation {
            background: #ecf0f1;
            padding: 10px;
            border-left: 4px solid #3498db;
            margin-top: 10px;
            border-radius: 0 4px 4px 0;
        }
        .graph-img { max-width: 100%; height: auto; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>গণিত বহুনির্বাচনী পরীক্ষা</h1>
    
    <div id="exam-section">
        <div id="timer-container">সময় বাকি: <span id="timer">10:00</span></div>
        <div id="questions-container"></div>
        <button class="btn" onclick="submitExam()">পরীক্ষা জমা দিন (Submit)</button>
    </div>

    <div id="result-section" class="hidden card">
        <h2>ফলাফল (Results)</h2>
        <p>মোট প্রশ্ন: <span id="total-q"></span></p>
        <p>সঠিক উত্তর: <span id="correct-q" class="correct-ans"></span></p>
        <p>ভুল উত্তর: <span id="wrong-q" class="wrong-ans"></span></p>
        <p>নেগেটিভ মার্কিং: <span id="negative-m" class="wrong-ans"></span></p>
        <h3>প্রাপ্ত নম্বর: <span id="final-score"></span></h3>
        <hr>
        <div id="review-container"></div>
    </div>

    <script>
        // 1. Define your questions here. 
        // IMPORTANT: Use double backslashes (\\) for LaTeX in JavaScript strings!
        // Use $...$ for inline math and $$...$$ for block math.
const quizData = [
    {
        question: "$n$ ঘাতের একটি বাস্তব সহগ বিশিষ্ট বহুপদী সমীকরণে কতগুলো মূল থাকে?",
        options: ["$>n$ সংখ্যক", "$<n$ সংখ্যক", "$n$ সংখ্যক", "$1$ টি"],
        correctAnswerIndex: 2,
        explanation: "একটি $n$ ঘাত সমীকরণের ঠিক $n$ সংখ্যক মূল থাকে (Fundamental Theorem of Algebra অনুযায়ী)।",
        graphUrl: ""
    },
    {
        question: "বাস্তব সহগ বিশিষ্ট $n$ ঘাতের একটি বহুপদী সমীকরণে অবাস্তব বা কাল্পনিক মূলগুলো — থাকে?",
        options: ["বিচ্ছিন্ন", "একত্রে", "যুগলে", "ইউনিক"],
        correctAnswerIndex: 2,
        explanation: "বাস্তব সহগবিশিষ্ট বহুপদী সমীকরণের কাল্পনিক মূলগুলো অনুবন্ধী যুগলে (Conjugate Pairs) থাকে।",
        graphUrl: ""
    },
    {
        question: "$4x^4 + x^2 + 3x - 1 = 0$ এর কয়টি যোগবোধক বাস্তব মূল থাকতে পারে?",
        options: ["$4$ টি", "$1$ টি", "$3$ টি", "$5$ টি"],
        correctAnswerIndex: 1,
        explanation: "এখানে $f(x) = 4x^4 + x^2 + 3x - 1$ রাশিতে $1$ টি চিহ্নের পরিবর্তন হয়েছে ( + থেকে - ), তাই ডেসকার্টসের নিয়ম অনুযায়ী $1$ টি যোগবোধক বাস্তব মূল থাকতে পারে।",
        graphUrl: ""
    },
    {
        question: "$x^4 + 2x^2 + 4 = 0$ সমীকরণের কতটি বাস্তব মূল বিদ্যমান?",
        options: ["$1$ টি", "$2$ টি", "$3$ টি", "বাস্তব মূল নাই"],
        correctAnswerIndex: 3,
        explanation: "$f(x) = x^4 + 2x^2 + 4$ এ কোন চিহ্নের পরিবর্তন হয়নি এবং $f(-x) = x^4 + 2x^2 + 4$ এ কোন চিহ্নের পরিবর্তন হয়নি। সুতরাং প্রদত্ত সমীকরণের কোন বাস্তব মূল নাই।",
        graphUrl: ""
    },
    {
        question: "যদি $f(x) = x^n f\\left(\\frac{1}{x}\\right)$ হয়, তবে $f(x) = 0$ ইহাকে কোন শ্রেণির বিপরীতমুখী সমীকরণ বলে?",
        options: ["২য় শ্রেণির", "১ম শ্রেণির", "৩য় শ্রেণির", "None"],
        correctAnswerIndex: 1,
        explanation: "যদি সহগগুলো শুরু এবং শেষ থেকে একই হয় এবং চিহ্নের পরিবর্তন না হয়, তবে তাকে ১ম শ্রেণির বিপরীতমুখী সমীকরণ বলে।",
        graphUrl: ""
    },
    {
        question: "যদি $f(x) = -x^n f\\left(\\frac{1}{x}\\right)$ হয় তবে ইহাকে কোন শ্রেণির বিপরীতমুখী সমীকরণ বলা হয়?",
        options: ["১ম", "২য়", "৩য়", "৪র্থ"],
        correctAnswerIndex: 1,
        explanation: "যদি সহগগুলো বিপরীত চিহ্নযুক্ত হয়, তবে তাকে ২য় শ্রেণির বিপরীতমুখী সমীকরণ বলে।",
        graphUrl: ""
    },
    {
        question: "$7x^5 - 6x^4 + 4x^3 - 4x^2 + 6x - 7 = 0$ কে কোন শ্রেণির বিপরীতমুখী সমীকরণ বলা হয়?",
        options: ["১ম", "২য়", "৩য়", "৪র্থ"],
        correctAnswerIndex: 1,
        explanation: "সর্বোচ্চ ঘাতের সহগ ($7$) এবং ধ্রুবক পদ ($-7$) বিপরীত চিহ্ন বিশিষ্ট হওয়ায় এটি ২য় শ্রেণির বিপরীতমুখী সমীকরণ।",
        graphUrl: ""
    },
    {
        question: "$2x^4 - 5x^3 + 4x^2 - 5x + 2 = 0$ কোন শ্রেণির বিপরীতমুখী সমীকরণ?",
        options: ["১ম", "২য়", "৩য়", "৪র্থ"],
        correctAnswerIndex: 0,
        explanation: "এখানে $f(x) = x^4 f\\left(\\frac{1}{x}\\right)$ শর্তটি পালিত হয়। ১ম শ্রেণির বিপরীতমুখী সমীকরণে সাধারণত সর্বোচ্চ ঘাতের সহগ এবং ধ্রুবক পদ একই হয়।",
        graphUrl: ""
    },
    {
        question: "$x^3 - 6x^2 + 11x + 6 = 0$ এর মূলত্রয় $\\alpha, \\beta, \\gamma$ হলে $\\alpha^2 + \\beta^2 + \\gamma^2 = ?$",
        options: ["$12$", "$10$", "$14$", "$15$"],
        correctAnswerIndex: 2,
        explanation: "এখানে $S_1 = 6$ এবং $P_2 = 11$। আমরা জানি, $\\alpha^2 + \\beta^2 + \\gamma^2 = (\\alpha + \\beta + \\gamma)^2 - 2(\\alpha\\beta + \\beta\\gamma + \\gamma\\alpha) = 6^2 - 2(11) = 36 - 22 = 14$।",
        graphUrl: ""
    },
    {
        question: "$3x^3 - 2x^2 + 5x + 10 = 0$ এর মূলত্রয় $\\alpha, \\beta, \\gamma$ হলে, $\\alpha\\beta\\gamma = ?$",
        options: ["$\\frac{10}{3}$", "$2$", "$\\frac{9}{4}$", "$-\\frac{10}{3}$"],
        correctAnswerIndex: 3,
        explanation: "$\\alpha\\beta\\gamma = (-1)^3 \\cdot \\frac{\\text{ধ্রুবক পদ}}{\\text{সর্বোচ্চ ঘাতের সহগ}} = -\\frac{10}{3}$।",
        graphUrl: ""
    }
];
        

        const marksPerCorrect = 1;
        const penaltyPerWrong = 0.25; // 0.25 negative marking
        let timeRemaining = 10 * 60; // 10 minutes in seconds
        let timerInterval;

        // 2. Render Questions
        function loadQuestions() {
            const container = document.getElementById('questions-container');
            let html = '';

            quizData.forEach((q, index) => {
                html += `<div class="card" id="q-block-${index}">
                    <h3>প্রশ্ন ${index + 1}: ${q.question}</h3>`;
                
                // If there's a graph, render the image
                if (q.graphUrl) {
                    html += `<img src="${q.graphUrl}" alt="Graph for Question ${index + 1}" class="graph-img">`;
                }

                q.options.forEach((opt, optIndex) => {
                    html += `<label class="option-label">
                        <input type="radio" name="q${index}" value="${optIndex}">
                        ${opt}
                    </label>`;
                });
                html += `</div>`;
            });

            container.innerHTML = html;
            renderMath(); // Call KaTeX to render the math
        }

        // 3. Render Math using KaTeX
        function renderMath() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }

        // 4. Timer Logic
        function startTimer() {
            timerInterval = setInterval(() => {
                timeRemaining--;
                let minutes = Math.floor(timeRemaining / 60);
                let seconds = timeRemaining % 60;
                document.getElementById('timer').innerText = 
                    `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    submitExam(); // Auto submit when time is up
                }
            }, 1000);
        }

        // 5. Submit and Calculate Logic
        function submitExam() {
            clearInterval(timerInterval);
            document.getElementById('exam-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            let correctCount = 0;
            let wrongCount = 0;
            let unattemptedCount = 0;
            let reviewHtml = '';

            quizData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                let isCorrect = false;

                reviewHtml += `<div class="card">
                    <h4>প্রশ্ন ${index + 1}: ${q.question}</h4>`;

                if (selected) {
                    const selectedVal = parseInt(selected.value);
                    if (selectedVal === q.correctAnswerIndex) {
                        correctCount++;
                        isCorrect = true;
                        reviewHtml += `<p class="correct-ans">আপনার উত্তর সঠিক: ${q.options[selectedVal]}</p>`;
                    } else {
                        wrongCount++;
                        reviewHtml += `<p class="wrong-ans">আপনার উত্তর ভুল: ${q.options[selectedVal]}</p>
                                       <p class="correct-ans">সঠিক উত্তর: ${q.options[q.correctAnswerIndex]}</p>`;
                    }
                } else {
                    unattemptedCount++;
                    reviewHtml += `<p style="color: #f39c12; font-weight:bold;">উত্তর দেওয়া হয়নি।</p>
                                   <p class="correct-ans">সঠিক উত্তর: ${q.options[q.correctAnswerIndex]}</p>`;
                }

                // Add explanation
                if (q.explanation) {
                    reviewHtml += `<div class="explanation"><strong>ব্যাখ্যা:</strong> ${q.explanation}</div>`;
                }
                reviewHtml += `</div>`;
            });

            // Calculate Scores
            const totalScore = (correctCount * marksPerCorrect) - (wrongCount * penaltyPerWrong);

            // Display Scores
            document.getElementById('total-q').innerText = quizData.length;
            document.getElementById('correct-q').innerText = correctCount;
            document.getElementById('wrong-q').innerText = wrongCount;
            document.getElementById('negative-m').innerText = (wrongCount * penaltyPerWrong).toFixed(2);
            document.getElementById('final-score').innerText = totalScore.toFixed(2) + " / " + (quizData.length * marksPerCorrect);
            
            document.getElementById('review-container').innerHTML = reviewHtml;
            renderMath(); // Render math in the review section
        }

        // Initialize on load
        window.onload = () => {
            loadQuestions();
            startTimer();
        };
    </script>
</body>
  </html>
